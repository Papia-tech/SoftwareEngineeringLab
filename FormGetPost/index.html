<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Course</title>
</head>
<body>

  <!-- action points to the target page, method is GET -->
  <!-- GET reveal data in URL, POST hide data from URL -->
  <form method="GET" action="courses.html">
    <h2>Add New Course</h2>
    <input type="text" name="cname" placeholder="Course Name" required><br><br>
    <input type="text" name="cd" placeholder="Course Description" required><br><br>
    <input type="submit" name="submit" value="Submit">
  </form>

</body>
</html>
